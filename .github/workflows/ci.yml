# CI (plan v3.3 S3a — NEW-03): the committed gates, run on every push/PR.
# Hardening per plan §Gates: Node 24 pinned (repo engines >=24; native type-stripping),
# immutable action pins (full commit SHAs, resolved live from the upstream repos
# 2026-07-10), least permissions, per-ref concurrency, explicit timeout.
# NO claim edits ride this slice — the README's CI wording flips at S3b, strictly
# after this workflow's first green run is observed (plan order).
# e2e joined at S5 (per plan): BOTH contracts (canonical + legacy why-chain) run in
# ARTIFACT MODE against the exact out/ that `npm run verify` just built — the same
# static-serving path the release gate and the host use. Dev-mode e2e stays a local
# + release-gate check (the release gate runs both modes).
name: CI

# Batch-A Codex P2 (accepted-fixed): unqualified push trigger per the plan's
# "on push/PR" — no branch filter; per-ref concurrency below de-duplicates.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Supply-chain hygiene (Wave 2, lane ci-hygiene). NON-blocking tonight: the audit
      # step reports advisories but never fails the build; a follow-up can flip it to
      # blocking once the first run's advisories have been read. Both files are CI
      # artifacts (14-day retention), runtime dependencies only (--omit=dev).
      - name: npm audit (runtime deps, non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit JSON
        run: npm audit --omit=dev --json > audit.json || true
      - name: CycloneDX SBOM (runtime deps)
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24 runtime; inputs name/path/if-no-files-found/retention-days verified in its action.yml, cloned at tag 2026-10-31; v4.6.2 = node20 runtime)
        if: ${{ !cancelled() }}
        with:
          name: supply-chain-audit-and-sbom
          path: |
            audit.json
            sbom.cdx.json
          retention-days: 14
          if-no-files-found: error
      - run: npm run verify        # typecheck + lint + vitest suites + build
      - run: npm run test:legacy   # the archived legacy module's 306-test suite
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:artifact   # dual e2e contracts over the verify-built out/ (S5)
