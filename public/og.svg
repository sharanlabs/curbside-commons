<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Curbside Commons — the proof layer for agentic commerce. A working prototype on simulated data.">
  <!--
    OG CARD — presentation lane (e), 2026-07-25. Static SVG because the site is
    a static export (next.config output:"export"), so there is no runtime image
    route. Colours are the committed design tokens (globals.css): paper #fbfbf9,
    ink #12141c, signal ultramarine #2438d6, ember #b42318 reserved for
    violations only — the site-wide lamp ledger holds here too.

    The card states prototype-on-simulated-data on its FACE. A social card is
    the one surface that travels without its page; a reader who only ever sees
    this image must still get the scope right.
  -->
  <rect width="1200" height="630" fill="#fbfbf9"/>
  <rect x="0" y="0" width="1200" height="6" fill="#2438d6"/>

  <!-- receipt-as-brand: the examination rule -->
  <g stroke="#12141c" stroke-opacity="0.14" stroke-width="1">
    <line x1="80" y1="196" x2="1120" y2="196"/>
    <line x1="80" y1="470" x2="1120" y2="470"/>
  </g>

  <!-- eyebrow -->
  <text x="80" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="2.6" fill="#2438d6">CURBSIDE COMMONS</text>
  <text x="80" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1.6" fill="#5c6069">DETERMINISTIC VERIFIER · AGENTIC COMMERCE</text>

  <!-- headline -->
  <text x="80" y="286" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="62" fill="#12141c">The feed says $2,150.</text>
  <text x="80" y="360" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="62" fill="#12141c">The pizza is $21.50.</text>

  <text x="80" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#22252f">Claims checked against the merchant&#8217;s own record — with the receipt attached.</text>

  <!-- honest scope, on the face of the card -->
  <g>
    <rect x="80" y="516" width="286" height="42" rx="4" fill="#12141c" fill-opacity="0.055"/>
    <text x="98" y="544" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1.1" fill="#22252f">SIMULATED DATA · PROTOTYPE</text>
  </g>
  <text x="392" y="544" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#5c6069">Not affiliated with any delivery platform.</text>
</svg>
